name: BTC 15-minute accuracy recorder

on:
  schedule:
    # Start five minutes before each 15-minute market boundary so TWAP can be captured at the open.
    - cron: "10,25,40,55 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-15m-accuracy-recorder
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      POLYMARKET_API_KEY: \${{ secrets.POLYMARKET_API_KEY }}
      POLYMARKET_API_SECRET: \${{ secrets.POLYMARKET_API_SECRET }}
      POLYMARKET_PASSPHRASE: \${{ secrets.POLYMARKET_PASSPHRASE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Capture a live-rule prediction and settlement data
        run: node scripts/record-rounds.mjs

      - name: Merge and save results for the dashboard
        run: |
          set -e
          cp data/rounds.json /tmp/collector-rounds.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/merge-rounds.mjs /tmp/collector-rounds.json
            git add data/rounds.json
            if git diff --cached --quiet; then
              echo "No data changes to commit."
              exit 0
            fi
            git commit -m "Record BTC 15-minute live-rule accuracy data"
            if git push origin main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying against latest main."
            sleep 3
          done
          echo "Could not save accuracy data after five attempts."
          exit 1
