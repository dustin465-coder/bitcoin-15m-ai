name: BTC 15-minute accuracy recorder

on:
  push:
    paths:
      - ".github/workflows/accuracy-recorder.yml"
      - "scripts/record-rounds.mjs"
  schedule:
    # Run three minutes after each market boundary; reconstruct the prediction as-of the boundary.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-15m-accuracy-recorder
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Capture prediction and settlement data
        run: node scripts/record-rounds.mjs

      - name: Merge and save results for the dashboard
        run: |
          set -e
          cp data/rounds.json /tmp/collector-rounds.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            node --input-type=module <<'NODE'
            import fs from "node:fs/promises";
            const local = JSON.parse(await fs.readFile("/tmp/collector-rounds.json", "utf8"));
            let remote = { version: 1, rounds: [] };
            try { remote = JSON.parse(await fs.readFile("data/rounds.json", "utf8")); } catch {}
            const byStart = new Map((remote.rounds || []).map(round => [round.roundStart, round]));
            for (const round of (local.rounds || [])) {
              const old = byStart.get(round.roundStart) || {};
              const merged = { ...old, ...round };
              for (const key of ["openingTwap","openingTwapTimestamp","closingTwap","closingTwapTimestamp","actualOutcome","result","resolvedAt"]) {
                if (round[key] == null && old[key] != null) merged[key] = old[key];
              }
              byStart.set(round.roundStart, merged);
            }
            const rounds = [...byStart.values()].sort((a,b) => a.roundStart - b.roundStart).slice(-300);
            const stamps = [remote.updatedAt, local.updatedAt].filter(Boolean).sort();
            const output = {
              version: 1,
              updatedAt: stamps.at(-1) || new Date().toISOString(),
              schedule: "GitHub Actions scheduled after each 15-minute boundary; predictions reconstructed as-of boundary",
              rounds
            };
            await fs.writeFile("data/rounds.json", JSON.stringify(output, null, 2) + "\\n");
            NODE

            git add data/rounds.json
            if git diff --cached --quiet; then
              echo "No data changes to commit."
              exit 0
            fi
            git commit -m "Record BTC 15-minute accuracy data"
            if git push origin main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying against latest main."
            sleep 3
          done
          echo "Could not save accuracy data after five attempts."
          exit 1
